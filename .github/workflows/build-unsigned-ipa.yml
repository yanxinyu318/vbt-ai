name: Build Unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_NAME: VBT-AI
  VERSION: "1.0.0"
jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Show versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Get dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist payload/Payload
          cp -R build/ios/iphoneos/Runner.app payload/Payload/
          (cd payload && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-$VERSION-unsigned.ipa" Payload)
          ls -la dist/
          unzip -l "dist/$APP_NAME-$VERSION-unsigned.ipa" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: VBT-AI-unsigned-ipa
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-unsigned.ipa
          if-no-files-found: error
